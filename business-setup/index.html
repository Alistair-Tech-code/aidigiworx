<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIDigiWorx Business HQ</title>
<style>
:root{--bg:#070b10;--panel:#0e141c;--panel2:#111923;--line:#24303d;--text:#f5f8fb;--muted:#91a0af;--neon:#00ff66;--blue:#3d8cff;--red:#7e2222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:32px}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--neon)}.actions{display:flex;gap:10px}.btn{border:1px solid transparent;border-radius:9px;padding:11px 17px;font-weight:800;cursor:pointer}.backup{background:var(--neon);color:#041009}.restore{background:transparent;color:#fff;border-color:#3a4654}.hero{margin-bottom:22px}.eyebrow{color:var(--neon);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:40px;letter-spacing:-1.8px;margin:8px 0 5px}.hero p{margin:0;color:var(--muted)}.delivery{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}.delivery h2{font-size:25px;margin:0 0 7px}.context{color:var(--muted);margin:0 0 20px}.form{display:flex;gap:10px;margin-bottom:24px}.input{flex:1;background:#080d13;color:#fff;border:1px solid #33404e;border-radius:9px;padding:12px 14px;outline:none}.input:focus{border-color:var(--neon)}.create{background:var(--neon);color:#041009}.customer{background:var(--panel2);border:1px solid #303d4b;border-radius:15px;padding:22px;position:relative}.customerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.customer h3{margin:0;font-size:21px}.complete{color:#67a7ff;font-size:13px;font-weight:800}.bar{height:7px;background:#202b37;border-radius:99px;overflow:hidden;margin-bottom:20px}.bar span{display:block;height:100%;width:100%;background:var(--blue)}.checks{display:grid;gap:13px}.check{display:flex;align-items:center;gap:12px;color:#e7edf3}.check input{appearance:none;width:20px;height:20px;border:2px solid #3c4b5b;border-radius:5px;margin:0;position:relative}.check input:checked{background:var(--blue);border-color:var(--blue)}.check input:checked:after{content:'✓';position:absolute;color:white;font-size:14px;font-weight:900;left:3px;top:-1px}.remove{margin-top:22px;background:var(--red);border-color:#9b3131;color:#fff}.profile{margin-top:25px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}.profile h2{margin:0 0 18px;font-size:24px}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#080d13;border:1px solid #303b48;border-radius:9px;padding:12px;color:#fff}.save{margin-top:12px;background:var(--neon);color:#041009}.empty{color:var(--muted);padding:15px 0}.toast{position:fixed;right:24px;bottom:24px;background:#16222d;border:1px solid #3b4b5a;padding:13px 16px;border-radius:10px;display:none}@media(max-width:700px){.wrap{padding:18px}.top{align-items:flex-start;gap:15px}.actions{flex-direction:column}.hero h1{font-size:32px}.form,.profileGrid{display:grid;grid-template-columns:1fr}.customerHead{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><span>AI</span>Digi<span>Worx</span> <strong>Business HQ</strong></div><div class="actions"><button class="btn backup" onclick="backup()">Backup</button><label class="btn restore">Restore<input id="restoreFile" type="file" accept=".json" hidden onchange="restore(event)"></label></div></header>
<main>
<section class="hero"><div class="eyebrow">CUSTOMER DELIVERY · R750 OFFER</div><h1>R750 Customer Delivery</h1><p>Use this for each paid Digital Business Setup customer.</p></section>
<section class="delivery">
<h2>Customer delivery</h2><p class="context">Create a delivery record, complete the checklist, and keep the customer setup process organised.</p>
<div class="form"><input id="newCustomer" class="input" placeholder="Customer name"><button class="btn create" onclick="createDelivery()">Create delivery</button></div>
<div id="customers"></div>
</section>
<section class="profile"><h2>Business Profile</h2><div class="profileGrid"><input id="businessName" class="field" value="AIDigiWorx"><input id="tagline" class="field" value="Smarter Tools. Bigger Results."><textarea id="about" class="field" rows="4" placeholder="Business description">AI and digital tools for small businesses, freelancers, creators and entrepreneurs.</textarea><input id="location" class="field" value="South Africa"></div><button class="btn save" onclick="saveProfile()">Save profile</button></section>
</main></div><div id="toast" class="toast"></div>
<script>
const KEY='aidigi_hq_delivery_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{customers:[{name:"Sarah's Designs",checks:[true,true,true,true,true]}],profile:{name:'AIDigiWorx',tagline:'Smarter Tools. Bigger Results.',about:'AI and digital tools for small businesses, freelancers, creators and entrepreneurs.',location:'South Africa'}};
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function createDelivery(){const n=document.getElementById('newCustomer').value.trim();if(!n){toast('Enter the customer name first.');return}db.customers.push({name:n,checks:[false,false,false,false,false]});document.getElementById('newCustomer').value='';persist();toast('Delivery created.')}
function removeCustomer(i){if(confirm('Remove this customer delivery record?')){db.customers.splice(i,1);persist();}}
function toggle(i,j,v){db.customers[i].checks[j]=v;persist()}
function render(){const labels=['Payment received','Customer info received','Setup completed','Customisation completed','Delivery confirmed'];document.getElementById('customers').innerHTML=db.customers.map((c,i)=>{const done=c.checks.filter(Boolean).length, pct=Math.round(done/5*100);return '<article class="customer"><div class="customerHead"><h3>'+esc(c.name)+'</h3><span class="complete">'+pct+'% Completed</span></div><div class="bar"><span style="width:'+pct+'%"></span></div><div class="checks">'+labels.map((x,j)=>'<label class="check"><input type="checkbox" '+(c.checks[j]?'checked':'')+' onchange="toggle('+i+','+j+',this.checked)"><span>'+esc(x)+'</span></label>').join('')+'</div><button class="btn remove" onclick="removeCustomer('+i+')">Remove customer</button></article>'}).join('')||'<div class="empty">No customer deliveries yet.</div>';document.getElementById('businessName').value=db.profile.name;document.getElementById('tagline').value=db.profile.tagline;document.getElementById('about').value=db.profile.about;document.getElementById('location').value=db.profile.location}
function esc(v){return String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function saveProfile(){db.profile={name:document.getElementById('businessName').value,tagline:document.getElementById('tagline').value,about:document.getElementById('about').value,location:document.getElementById('location').value};persist();toast('Profile saved.')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='aidigiworx-business-hq-backup.json';a.click();toast('Backup created.')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();toast('Backup restored.')}catch(_){toast('Invalid backup file.')}};r.readAsText(f)}
render();
</script></body></html>
